<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2a221b" />
      <stop offset="50%" stop-color="#181513" />
      <stop offset="100%" stop-color="#0d0d0e" />
    </radialGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9436" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ff5500" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Ambient Core Blur -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="needleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Compass Needles Gradients -->
    <!-- North Left: Radiant Amber -->
    <linearGradient id="northLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc266" />
      <stop offset="50%" stop-color="#ff881a" />
      <stop offset="100%" stop-color="#e64a00" />
    </linearGradient>

    <!-- North Right: Deep Flame -->
    <linearGradient id="northRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b1a" />
      <stop offset="70%" stop-color="#d63300" />
      <stop offset="100%" stop-color="#8a1800" />
    </linearGradient>

    <!-- South Left: Cool Silver Slate -->
    <linearGradient id="southLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- South Right: Dark Titanium -->
    <linearGradient id="southRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff881a" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff5500" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Micro Border -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="220" r="100" fill="#ff5500" opacity="0.32" filter="url(#coreGlow)" />

  <!-- Outer Orbital Compass Ring -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="8 12 24 12" opacity="0.7" />
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.08" />

  <!-- Cardinal Navigation Markers (N, S, W, E dots) -->
  <circle cx="256" cy="80" r="4" fill="#ff9436" />
  <circle cx="256" cy="432" r="3.5" fill="#64748b" />
  <circle cx="80" cy="256" r="3.5" fill="#64748b" />
  <circle cx="432" cy="256" r="3.5" fill="#ff7b1a" />

  <!-- Compass Star Body with Shadow -->
  <g filter="url(#needleShadow)" transform="rotate(-30 256 256)">
    <!-- North Pointer (Left Facet) -->
    <path d="M 256,92 L 256,256 L 210,256 Z" fill="url(#northLeft)" />
    <!-- North Pointer (Right Facet) -->
    <path d="M 256,92 L 302,256 L 256,256 Z" fill="url(#northRight)" />

    <!-- South Pointer (Left Facet) -->
    <path d="M 256,420 L 210,256 L 256,256 Z" fill="url(#southLeft)" />
    <!-- South Pointer (Right Facet) -->
    <path d="M 256,420 L 256,256 L 302,256 Z" fill="url(#southRight)" />

    <!-- East Wing (Left Facet) -->
    <path d="M 390,256 L 256,234 L 256,256 Z" fill="url(#northLeft)" opacity="0.9" />
    <!-- East Wing (Right Facet) -->
    <path d="M 390,256 L 256,256 L 256,278 Z" fill="url(#northRight)" opacity="0.9" />

    <!-- West Wing (Left Facet) -->
    <path d="M 122,256 L 256,256 L 256,234 Z" fill="url(#southLeft)" opacity="0.8" />
    <!-- West Wing (Right Facet) -->
    <path d="M 122,256 L 256,278 L 256,256 Z" fill="url(#southRight)" opacity="0.8" />

    <!-- Center Core Hub -->
    <circle cx="256" cy="256" r="24" fill="#0d0d0e" stroke="#ff7b1a" stroke-width="4" />
    <circle cx="256" cy="256" r="13" fill="#ffffff" />
    <circle cx="256" cy="256" r="6" fill="#ff5500" />
  </g>
</svg>
